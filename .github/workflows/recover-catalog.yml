name: Audit recovered CherryRule catalog

on:
  push:
    branches:
      - recovery/catalog-source-20260814
    paths:
      - .github/workflows/recover-catalog.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovered catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validators
        run: python3 -m pip install -r requirements-dev.txt google-re2

      - name: Validate every rule and build a clean corpus
        id: validate
        continue-on-error: true
        run: python3 tools/audit_catalog.py

      - name: Commit audit artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f audit/catalog-validation.json
          test -f audit/cherry-rules.valid.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/catalog-validation.json audit/cherry-rules.valid.json
          if git diff --cached --quiet; then
            echo "audit artifacts unchanged"
          else
            git commit -m "chore: add validated CherryRule corpus [skip ci]"
            git push origin HEAD
          fi

      - name: Enforce audit result
        if: steps.validate.outcome != 'success'
        run: |
          echo "CherryRule catalog contains invalid rules. See audit/catalog-validation.json." >&2
          exit 1
