name: Recover embedded CherryRule catalog

on:
  push:
    branches:
      - recovery/catalog-source-20260814
    paths:
      - .github/workflows/recover-catalog.yml

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and safely extract catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd().resolve()
          parts = sorted((repo / ".bootstrap").glob("part-*.b64"))
          if not parts:
              raise SystemExit("no .bootstrap/part-*.b64 files found")

          encoded = "".join("".join(part.read_text(encoding="ascii").split()) for part in parts)
          payload = base64.b64decode(encoded, validate=True)
          print(f"payload: {len(parts)} parts, {len(payload)} bytes, sha256={hashlib.sha256(payload).hexdigest()}")

          source = Path("/tmp/cherryrule-source")
          shutil.rmtree(source, ignore_errors=True)
          source.mkdir(parents=True)

          def checked_name(name: str) -> None:
              normalized = name.replace("\\", "/")
              path = PurePosixPath(normalized)
              if path.is_absolute() or ".." in path.parts:
                  raise ValueError(f"unsafe archive path: {name!r}")

          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:*") as archive:
              members = archive.getmembers()
              for member in members:
                  checked_name(member.name)
                  if member.issym() or member.islnk():
                      raise ValueError(f"links are not accepted in recovery archive: {member.name!r}")
              archive.extractall(source, members=members, filter="data")

          required = [
              source / "catalog.yaml",
              source / "dist" / "cherry-rules.bundle.yaml",
              source / "dist" / "cherry-rules.re2-catalog.json",
              source / "schema" / "cherry-rule-pack.schema.json",
          ]
          missing = [str(path.relative_to(source)) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"recovered archive is missing required files: {missing}")

          print(f"recovered {sum(1 for path in source.rglob('*') if path.is_file())} files")
          PY

      - name: Replace bootstrap with recovered catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import shutil
          from pathlib import Path

          repo = Path.cwd().resolve()
          source = Path("/tmp/cherryrule-source")
          shutil.rmtree(repo / ".bootstrap", ignore_errors=True)

          for child in source.iterdir():
              if child.name == ".github":
                  continue
              destination = repo / child.name
              if child.is_dir():
                  shutil.copytree(child, destination, dirs_exist_ok=True)
              else:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(child, destination)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "chore: recover embedded CherryRule catalog for inspection [skip ci]"
          git push origin HEAD
