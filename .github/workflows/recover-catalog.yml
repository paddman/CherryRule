name: Recover embedded CherryRule catalog

on:
  push:
    branches:
      - recovery/catalog-source-20260814
    paths:
      - .github/workflows/recover-catalog.yml

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode outer archive and nested Git bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd().resolve()
          outer_parts = sorted((repo / ".bootstrap").glob("part-*.b64"))
          if not outer_parts:
              raise SystemExit("no .bootstrap/part-*.b64 files found")

          encoded = "".join("".join(part.read_text(encoding="ascii").split()) for part in outer_parts)
          payload = base64.b64decode(encoded, validate=True)
          print(f"outer payload: {len(outer_parts)} parts, {len(payload)} bytes, sha256={hashlib.sha256(payload).hexdigest()}")

          out = Path("/tmp/cherryrule-outer")
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)

          def checked_name(name: str) -> None:
              normalized = name.replace("\\", "/")
              path = PurePosixPath(normalized)
              if path.is_absolute() or ".." in path.parts:
                  raise ValueError(f"unsafe archive path: {name!r}")

          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:*") as archive:
              members = archive.getmembers()
              for member in members:
                  checked_name(member.name)
                  if member.issym() or member.islnk():
                      raise ValueError(f"links are not accepted in recovery archive: {member.name!r}")
              archive.extractall(out, members=members, filter="data")

          print("outer archive entries:")
          for path in sorted(out.rglob("*")):
              if path.is_file():
                  print(f"  {path.relative_to(out)} ({path.stat().st_size} bytes)")

          nested_parts = sorted(out.rglob("source.part-*.b64"))
          if not nested_parts:
              nested_parts = sorted(out.rglob("*.part-*.b64"))
          if not nested_parts:
              raise SystemExit("outer archive contains no nested source.part-*.b64 files")

          nested_encoded = "".join(
              "".join(part.read_text(encoding="ascii").split()) for part in nested_parts
          )
          nested = base64.b64decode(nested_encoded, validate=True)
          bundle = Path("/tmp/cherryrule-source.bundle")
          bundle.write_bytes(nested)
          print(f"nested payload: {len(nested_parts)} parts, {len(nested)} bytes, sha256={hashlib.sha256(nested).hexdigest()}, magic={nested[:24]!r}")
          PY

          rm -rf /tmp/cherryrule-bundle-repo /tmp/cherryrule-source
          mkdir -p /tmp/cherryrule-bundle-repo /tmp/cherryrule-source
          git -C /tmp/cherryrule-bundle-repo init
          git -C /tmp/cherryrule-bundle-repo bundle verify /tmp/cherryrule-source.bundle
          git -C /tmp/cherryrule-bundle-repo fetch /tmp/cherryrule-source.bundle \
            refs/heads/injected:refs/remotes/payload/injected
          git --git-dir=/tmp/cherryrule-bundle-repo/.git \
            --work-tree=/tmp/cherryrule-source \
            checkout -f refs/remotes/payload/injected -- .

          if find /tmp/cherryrule-source -type l -print -quit | grep -q .; then
            echo "recovered source contains symbolic links; refusing to copy" >&2
            exit 1
          fi
          test -f /tmp/cherryrule-source/settings/rules.yaml
          test -f /tmp/cherryrule-source/README.md
          find /tmp/cherryrule-source -maxdepth 3 -type f | sort

      - name: Replace bootstrap with recovered catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import shutil
          from pathlib import Path

          repo = Path.cwd().resolve()
          source = Path("/tmp/cherryrule-source")
          shutil.rmtree(repo / ".bootstrap", ignore_errors=True)

          for child in source.iterdir():
              if child.name == ".git":
                  continue
              destination = repo / child.name
              if child.is_dir():
                  shutil.copytree(child, destination, dirs_exist_ok=True)
              else:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(child, destination)

          (repo / ".github" / "workflows" / "recover-catalog.yml").unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "chore: recover embedded CherryRule catalog [skip ci]"
          git push origin HEAD
